<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hivemap</title>
<style>
:root{
  --bg:#0B0D10; --panel:rgba(20,23,28,.92); --line:#262B32; --ink:#E7E9EC; --muted:#8A919B; --faint:#5A616B; --accent:#D97757; --err:#FF5D5D; --wait:#FFE066;
  --c-read:#6CA8FF; --c-write:#F2B84B; --c-exec:#5FD39A; --c-agent:#B48CFF; --c-web:#4FD1E8; --c-mcp:#FF7AB6; --c-other:#A3AAB4;
  --mono:ui-monospace,"JetBrains Mono","Cascadia Code","SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.grabbing{cursor:grabbing}
#map.pointer{cursor:pointer}

.hud{position:fixed;left:12px;top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(8px);max-width:calc(100% - 350px)}
.logo{display:flex;align-items:center;gap:8px;font-weight:650}
.beacon{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:ring 1.6s infinite}
.offline .beacon{background:var(--err);animation:none}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(217,119,87,.55)}100%{box-shadow:0 0 0 8px rgba(217,119,87,0)}}
.stats{color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}

.tools{position:fixed;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;backdrop-filter:blur(8px)}
.seg button{background:transparent;border:0;color:var(--muted);padding:6px 10px;cursor:pointer;font:11.5px var(--mono)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:#232830;color:var(--ink)}

.legend{position:fixed;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--muted);font-size:11.5px;max-width:calc(100% - 24px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}
.legend i.sq{border-radius:2px}
.hint{color:var(--faint)}

#inspector{position:fixed;right:12px;top:56px;bottom:12px;width:330px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);display:flex;flex-direction:column;overflow:hidden}
.ins-head{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.ins-head h2{margin:0;font-size:15px;line-height:1.3;word-break:break-word}
.ins-head .kind{font:600 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:5px}
.close{margin-left:auto;flex:none;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.close:hover{color:var(--ink)}
.ins-body{padding:12px 14px;overflow:auto;display:grid;gap:14px;align-content:start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);word-break:break-all}
.sec{font:600 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.quote{font-size:12.5px;color:#C9CDD3;border-left:2px solid var(--accent);padding-left:9px;white-space:pre-wrap;word-break:break-word;max-height:9em;overflow:auto}
.list{display:grid;gap:2px}
.row{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border-radius:7px;font-size:12px;background:transparent;border:0;text-align:left;width:100%}
button.row{cursor:pointer}
button.row:hover{background:#232830}
.row i{width:8px;height:8px;border-radius:50%}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-family:var(--mono);margin-left:6px}
.row .d{color:var(--muted);font:11px var(--mono)}
.live{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.err{color:var(--err)}
pre.io{margin:0;font:11.5px/1.5 var(--mono);color:#C9CDD3;background:#101317;border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto}
.jump{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jump button{display:inline-flex;align-items:center;gap:7px;background:#232830;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:12.5px}
.jump button:hover{border-color:var(--accent);color:var(--accent)}
.jump span{color:var(--muted);font-size:12px}

#tip{position:fixed;pointer-events:none;background:#21262D;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;max-width:320px;z-index:9;box-shadow:0 10px 28px rgba(0,0,0,.55)}
#tip b{font-weight:600}
#tip div{color:var(--muted);font-family:var(--mono);font-size:11px;word-break:break-word}
.empty{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
@media (max-width:640px){.hud{max-width:calc(100% - 24px)}.tools{top:84px}#inspector{top:auto;height:48%;right:12px;left:12px;width:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="map" aria-label="Live map of Claude Code sessions, agents, tool calls and files"></canvas>
<div class="empty" id="empty" hidden><div><b>No Claude Code sessions running</b>Start <code>claude</code> in a terminal and it lands on the map.</div></div>

<div class="hud"><div class="logo"><span class="beacon"></span>hivemap</div><div class="stats" id="stats">Connecting…</div></div>

<div class="tools">
  <div class="seg" role="group" aria-label="Show on map">
    <button id="tFiles" aria-pressed="true">Files</button>
    <button id="tCalls" aria-pressed="true">Calls</button>
  </div>
  <div class="seg" role="group" aria-label="Time window" id="win">
    <button data-w="300">5m</button><button data-w="900">15m</button><button data-w="3600">1h</button>
  </div>
  <div class="seg"><button id="fit" aria-pressed="true" title="Fit and follow activity (F)">Follow</button></div>
</div>

<div class="legend" id="legend"></div>
<aside id="inspector" hidden aria-live="polite"></aside>
<div id="tip" hidden></div>

<script>
const CATS = {read:'Read', write:'Edit', exec:'Shell', agent:'Agent', web:'Web', mcp:'MCP', other:'Other'};
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = Object.fromEntries(Object.keys(CATS).map(k => [k, css(`--c-${k}`)]));
const WAIT = css('--wait'), ACCENT = css('--accent'), MUTED = css('--muted'), FAINT = css('--faint'), INK = css('--ink'), ERR = css('--err');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cut = (s, n) => (s = String(s ?? '')).length > n ? s.slice(0, n - 1) + '…' : s;
const ago = s => s < 60 ? `${Math.round(s)}s` : s < 3600 ? `${Math.round(s/60)}m` : `${(s/3600).toFixed(1)}h`;
const dur = s => s < 1 ? `${Math.round(s*1000)}ms` : s < 60 ? `${s.toFixed(1)}s` : ago(s);
const base = p => p.split('/').pop();
const home = p => String(p || '').replace(/^\/home\/[^/]+/, '~');
const modelName = m => m ? m.replace(/^claude-/, '').replace(/-(\d+)-(\d+)(-\d{8})?$/, ' $1.$2').replace(/-(\d+)$/, ' $1') : '—';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let data = null, offset = 0, win = 900, showFiles = true, showCalls = true;
try { win = Number(localStorage.getItem('win')) || 900; } catch {}
const nowS = () => (Date.now() + offset) / 1000;

/* ---------- graph ---------- */
const nodes = new Map();
let edges = [], alpha = 1, adj = new Map(), sessionCount = 0;
const R = {session:22, agent:12, tool:5, file:7};
const CHARGE = {session:2200, agent:700, tool:90, file:260};

function upsert(id, kind, info, near){
  let n = nodes.get(id);
  if (!n){
    const a = Math.random()*Math.PI*2, d = near ? 30 + Math.random()*30 : 0;
    const p = near || spawnSession();
    n = {id, kind, x:p.x + Math.cos(a)*d, y:p.y + Math.sin(a)*d, vx:0, vy:0, born:performance.now()};
    nodes.set(id, n);
    alpha = Math.max(alpha, .6);
  }
  Object.assign(n, info, {kind, seen:true, r:R[kind]});
  return n;
}
function spawnSession(){
  const i = sessionCount++, a = i*2.39996, d = 140*Math.sqrt(i);   // golden-angle spiral
  return {x:Math.cos(a)*d, y:Math.sin(a)*d};
}

function sync(){
  const now = nowS(), from = now - win;
  nodes.forEach(n => n.seen = false);
  const E = [], files = new Map();
  for (const s of data.sessions){
    const sid = `s:${s.id}`;
    const sn = upsert(sid, 'session', {s, label:s.name, active:s.status !== 'idle', waiting:s.status === 'waiting'}, null);
    const agentNode = {main: sn};
    for (const a of s.agents) if (a.id !== 'main'){
      const parent = agentNode[a.parent] || sn;
      agentNode[a.id] = upsert(`a:${s.id}:${a.id}`, 'agent', {s, a, label:a.label, active:a.running}, parent);
    }
    for (const a of s.agents) if (a.id !== 'main'){
      const n = agentNode[a.id], p = agentNode[a.parent] || sn;
      E.push({a:p.id, b:n.id, kind:'spawn', len:95, color:COL.agent, active:a.running});
    }
    for (const a of s.agents){
      const an = agentNode[a.id];
      const evs = a.events.filter(e => e.c !== 'prompt' && (e.t1 ?? now) >= from);
      if (showCalls){
        const keep = new Set([...evs.slice(-6), ...evs.filter(e => e.t1 == null)]);
        for (const e of keep){
          const tn = upsert(`t:${s.id}:${a.id}:${e.t0}:${e.n}`, 'tool', {e, s, owner:an.id, label:e.n, active:e.t1 == null}, an);
          E.push({a:an.id, b:tn.id, kind:'call', len:38, color:COL[e.c], active:e.t1 == null, age:now - (e.t1 ?? now)});
        }
      }
      if (showFiles) for (const e of evs) if (e.f){
        const fid = `f:${e.f}`, key = `${an.id}|${fid}`;
        const f = files.get(fid) || files.set(fid, {path:e.f, near:an, touches:new Map()}).get(fid);
        const prev = f.touches.get(key);
        const write = e.c === 'write' || prev?.write;
        f.touches.set(key, {agent:an, session:s, write, t:Math.max(prev?.t ?? 0, e.t1 ?? now), live:e.t1 == null || prev?.live});
      }
    }
  }
  for (const [fid, f] of files){
    const touches = [...f.touches.values()];
    upsert(fid, 'file', {path:f.path, label:base(f.path), touches, shared:new Set(touches.map(t => t.agent.id)).size > 1,
      write:touches.some(t => t.write), active:touches.some(t => t.live)}, f.near);
    for (const t of touches) E.push({a:t.agent.id, b:fid, kind:'file', len:80, color:t.write ? COL.write : COL.read, active:t.live, age:now - t.t});
  }
  const before = nodes.size;
  for (const [id, n] of nodes) if (!n.seen) nodes.delete(id);
  if (nodes.size !== before) alpha = Math.max(alpha, .5);
  edges = E.filter(e => nodes.has(e.a) && nodes.has(e.b));
  adj = new Map();
  for (const e of edges){
    (adj.get(e.a) || adj.set(e.a, new Set()).get(e.a)).add(e.b);
    (adj.get(e.b) || adj.set(e.b, new Set()).get(e.b)).add(e.a);
  }
  if (selected && !find(selected)) select(null);
}

// ponytail: O(n²) repulsion, fine up to a few hundred nodes; use a quadtree if it ever stutters
function step(){
  if (alpha < .004) return;
  const list = [...nodes.values()];
  for (let i = 0; i < list.length; i++){
    const a = list[i];
    for (let j = i + 1; j < list.length; j++){
      const b = list[j];
      let dx = a.x - b.x, dy = a.y - b.y, d2 = dx*dx + dy*dy;
      if (d2 < 1){ dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      if (d2 > 250000) continue;
      const f = Math.sqrt(CHARGE[a.kind]*CHARGE[b.kind]) / d2 * alpha;
      const fx = dx*f/Math.sqrt(d2), fy = dy*f/Math.sqrt(d2);
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
  }
  for (const e of edges){
    const a = nodes.get(e.a), b = nodes.get(e.b);
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const k = (d - e.len) / d * .06 * alpha;
    a.vx += dx*k; a.vy += dy*k; b.vx -= dx*k; b.vy -= dy*k;
  }
  for (const n of list){
    const g = n.kind === 'session' ? .004 : .0008;
    n.vx -= n.x*g*alpha; n.vy -= n.y*g*alpha;
    n.vx *= .82; n.vy *= .82;
    const v = Math.hypot(n.vx, n.vy);
    if (v > 25){ n.vx *= 25/v; n.vy *= 25/v; }
    if (n.fx != null){ n.x = n.fx; n.y = n.fy; n.vx = n.vy = 0; }
    else { n.x += n.vx; n.y += n.vy; }
  }
  alpha *= .99;
}

/* ---------- camera ---------- */
const cv = $('#map'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, cam = {x:0, y:0, k:1}, follow = true;
function resize(){
  dpr = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
}
addEventListener('resize', resize); resize();
const toWorld = (sx, sy) => ({x:(sx - W/2)/cam.k + cam.x, y:(sy - H/2)/cam.k + cam.y});
function fitTarget(){
  if (!nodes.size) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  nodes.forEach(n => { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); });
  const insp = $('#inspector').hidden || W < 640 ? 0 : 340;
  const k = Math.min((W - insp - 120)/(x1 - x0 + 1), (H - 160)/(y1 - y0 + 1), 1.8);
  return {x:(x0 + x1)/2 + insp/2/k, y:(y0 + y1)/2, k:Math.max(.2, k)};
}
function setFollow(v){ follow = v; $('#fit').setAttribute('aria-pressed', String(v)); }

/* ---------- drawing ---------- */
let hover = null, selected = null;
function nodeColor(n){
  if (n.kind === 'session') return n.waiting ? WAIT : n.active ? ACCENT : MUTED;
  if (n.kind === 'agent') return n.active ? COL.agent : MUTED;
  if (n.kind === 'tool') return n.e.err ? ERR : COL[n.e.c];
  return n.write ? COL.write : COL.read;
}
function draw(t){
  const now = nowS();
  if (follow){ const f = fitTarget(); if (f){ cam.x += (f.x - cam.x)*.06; cam.y += (f.y - cam.y)*.06; cam.k += (f.k - cam.k)*.06; } }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0B0D10'; ctx.fillRect(0, 0, W, H);

  // dot grid in world space
  let gs = 40; while (gs*cam.k < 22) gs *= 2;
  const tl = toWorld(0, 0), br = toWorld(W, H);
  ctx.fillStyle = '#1A1E24';
  for (let x = Math.floor(tl.x/gs)*gs; x < br.x; x += gs)
    for (let y = Math.floor(tl.y/gs)*gs; y < br.y; y += gs){
      const sx = (x - cam.x)*cam.k + W/2, sy = (y - cam.y)*cam.k + H/2;
      ctx.fillRect(sx - 1, sy - 1, 2, 2);
    }

  ctx.setTransform(dpr*cam.k, 0, 0, dpr*cam.k, dpr*(W/2 - cam.x*cam.k), dpr*(H/2 - cam.y*cam.k));
  const focus = hover || (selected && nodes.get(selected));
  const near = focus ? adj.get(focus.id) || new Set() : null;
  const dim = id => focus && id !== focus.id && !near.has(id);
  const px = 1/cam.k;

  // session halos
  for (const n of nodes.values()) if (n.kind === 'session'){
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 160);
    g.addColorStop(0, n.active ? 'rgba(217,119,87,.10)' : 'rgba(138,145,155,.05)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, 160, 0, Math.PI*2); ctx.fill();
  }

  // edges
  for (const e of edges){
    const a = nodes.get(e.a), b = nodes.get(e.b);
    const faded = dim(e.a) && dim(e.b) || (focus && e.a !== focus.id && e.b !== focus.id);
    const ageA = e.active ? 1 : Math.max(.25, 1 - (e.age || 0)/win);
    ctx.globalAlpha = (faded ? .08 : e.kind === 'spawn' ? .7 : .45) * ageA;
    ctx.strokeStyle = e.color;
    ctx.lineWidth = (e.kind === 'spawn' ? 2 : e.kind === 'file' ? 1 : 1.3) * px * (e.active ? 1.6 : 1);
    const mx = (a.x + b.x)/2 - (b.y - a.y)*.12, my = (a.y + b.y)/2 + (b.x - a.x)*.12;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(mx, my, b.x, b.y); ctx.stroke();
    if (e.active && !reduced){
      ctx.globalAlpha = faded ? .2 : 1; ctx.fillStyle = e.color;
      for (let i = 0; i < 3; i++){
        const u = ((t/900 + i/3) % 1), v = 1 - u;
        const qx = v*v*a.x + 2*v*u*mx + u*u*b.x, qy = v*v*a.y + 2*v*u*my + u*u*b.y;
        ctx.beginPath(); ctx.arc(qx, qy, 2.2*px*Math.min(1.5, Math.max(.8, cam.k)), 0, Math.PI*2); ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;

  // nodes
  const order = ['file', 'tool', 'agent', 'session'];
  const list = [...nodes.values()].sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
  for (const n of list){
    const c = nodeColor(n), grow = Math.min(1, (performance.now() - n.born)/400);
    const age = n.kind === 'tool' && !n.active ? Math.max(.3, 1 - (now - (n.e.t1 ?? now))/win) : 1;
    ctx.globalAlpha = (dim(n.id) ? .15 : 1) * age;
    const r = n.r * grow;
    if (n.active && !reduced){
      const pulse = (t % 1600)/1600;
      ctx.strokeStyle = c; ctx.lineWidth = 2*px; ctx.globalAlpha *= (1 - pulse)*.8;
      ctx.beginPath(); ctx.arc(n.x, n.y, r + 4 + pulse*14, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = (dim(n.id) ? .15 : 1) * age;
    }
    if (n.kind === 'file'){
      ctx.fillStyle = '#0B0D10'; ctx.strokeStyle = c; ctx.lineWidth = 1.6*px*Math.max(1, cam.k*.8);
      roundRect(n.x - r, n.y - r, r*2, r*2, 2); ctx.fill(); ctx.stroke();
      if (n.shared){ ctx.fillStyle = c; roundRect(n.x - r/2.5, n.y - r/2.5, r/1.25, r/1.25, 1); ctx.fill(); }
    } else if (n.kind === 'tool'){
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = n.kind === 'session' ? '#15181D' : '#101317';
      ctx.strokeStyle = c; ctx.lineWidth = (n.kind === 'session' ? 3 : 2)*px*Math.max(1, cam.k*.7);
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      if (n.active){ ctx.fillStyle = c; ctx.beginPath(); ctx.arc(n.x, n.y, r*.38, 0, Math.PI*2); ctx.fill(); }
    }
    if (selected === n.id){
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5*px; ctx.setLineDash([4*px, 3*px]);
      ctx.beginPath(); ctx.arc(n.x, n.y, r + 7, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // labels, constant screen size
  for (const n of list){
    const show = n.kind === 'session' || n === focus || (near && near.has(n.id) && n.kind !== 'tool')
      || (n.kind === 'agent' && (cam.k > .55 || n.active)) || (n.kind === 'file' && (cam.k > 1.1 || n.shared || n.active));
    if (!show || (dim(n.id) && n.kind !== 'session')) continue;
    ctx.globalAlpha = dim(n.id) ? .35 : 1;
    const y = n.y + n.r + 6*px;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    if (n.kind === 'session'){
      ctx.font = `600 ${13*px}px ui-sans-serif,system-ui,sans-serif`; ctx.fillStyle = INK;
      halo(n.label, n.x, y);
      ctx.font = `${11*px}px ui-sans-serif,system-ui,sans-serif`; ctx.fillStyle = MUTED;
      halo(cut(n.s.title || home(n.s.cwd), 34), n.x, y + 16*px);
    } else {
      ctx.font = `${(n.kind === 'agent' ? 12 : 11)*px}px ${n.kind === 'file' ? 'ui-monospace,monospace' : 'ui-sans-serif,system-ui,sans-serif'}`;
      ctx.fillStyle = n.kind === 'agent' ? INK : MUTED;
      halo(cut(n.kind === 'tool' ? `${n.e.n} · ${n.e.s}` : n.label, 40), n.x, y);
    }
  }
  ctx.globalAlpha = 1;
}
function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function halo(text, x, y){
  ctx.lineWidth = 4/cam.k; ctx.strokeStyle = '#0B0D10'; ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y); ctx.fillText(text, x, y);
}

function frame(t){
  step();
  draw(t);
  requestAnimationFrame(frame);
}

/* ---------- interaction ---------- */
function pick(sx, sy){
  const p = toWorld(sx, sy);
  let best = null, bd = Infinity;
  for (const n of nodes.values()){
    const d = Math.hypot(n.x - p.x, n.y - p.y) - n.r;
    if (d < 6/cam.k && d < bd){ best = n; bd = d; }
  }
  return best;
}
let drag = null, pan = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const n = pick(e.clientX, e.clientY);
  if (n){ drag = {n, moved:false, sx:e.clientX, sy:e.clientY}; }
  else { pan = {sx:e.clientX, sy:e.clientY, x:cam.x, y:cam.y, moved:false}; cv.classList.add('grabbing'); }
});
cv.addEventListener('pointermove', e => {
  if (drag){
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 3) drag.moved = true;
    if (drag.moved){
      const p = toWorld(e.clientX, e.clientY);
      drag.n.fx = drag.n.x = p.x; drag.n.fy = drag.n.y = p.y;
      alpha = Math.max(alpha, .3); setFollow(false);
    }
  } else if (pan){
    if (Math.hypot(e.clientX - pan.sx, e.clientY - pan.sy) > 3){ pan.moved = true; setFollow(false); }
    cam.x = pan.x - (e.clientX - pan.sx)/cam.k; cam.y = pan.y - (e.clientY - pan.sy)/cam.k;
  } else {
    hover = pick(e.clientX, e.clientY);
    cv.classList.toggle('pointer', !!hover);
    showTip(hover, e.clientX, e.clientY);
  }
});
cv.addEventListener('pointerup', () => {
  if (drag && !drag.moved) select(drag.n.id);
  if (pan && !pan.moved) select(null);
  drag = pan = null; cv.classList.remove('grabbing');
});
cv.addEventListener('pointerleave', () => { hover = null; $('#tip').hidden = true; });
cv.addEventListener('dblclick', e => {
  const n = pick(e.clientX, e.clientY);
  if (n){ n.fx = n.fy = null; alpha = Math.max(alpha, .3); } else setFollow(true);
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const before = toWorld(e.clientX, e.clientY);
  cam.k = Math.min(4, Math.max(.15, cam.k*Math.exp(-e.deltaY*.0015)));
  const after = toWorld(e.clientX, e.clientY);
  cam.x += before.x - after.x; cam.y += before.y - after.y;
  setFollow(false);
}, {passive:false});
addEventListener('keydown', e => {
  if (e.target.closest('button')) return;
  if (e.key === 'f' || e.key === 'F') setFollow(true);
  if (e.key === 'Escape') select(null);
  if (e.key === '+' || e.key === '=') { cam.k = Math.min(4, cam.k*1.2); setFollow(false); }
  if (e.key === '-') { cam.k = Math.max(.15, cam.k/1.2); setFollow(false); }
});
$('#fit').onclick = () => setFollow(!follow);
$('#tFiles').onclick = e => { showFiles = !showFiles; e.target.setAttribute('aria-pressed', String(showFiles)); if (data) sync(); };
$('#tCalls').onclick = e => { showCalls = !showCalls; e.target.setAttribute('aria-pressed', String(showCalls)); if (data) sync(); };
document.querySelectorAll('#win button').forEach(b => {
  b.setAttribute('aria-pressed', String(Number(b.dataset.w) === win));
  b.onclick = () => {
    win = Number(b.dataset.w);
    try { localStorage.setItem('win', win); } catch {}
    document.querySelectorAll('#win button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    if (data) sync();
  };
});

function showTip(n, x, y){
  const tip = $('#tip');
  if (!n){ tip.hidden = true; return; }
  const now = nowS();
  let head = esc(n.label), body = '';
  if (n.kind === 'session') body = `${esc(n.s.status)} · ${esc(home(n.s.cwd))}`;
  if (n.kind === 'agent') body = esc(activity(n.a, now));
  if (n.kind === 'tool'){ head = `<span style="color:${COL[n.e.c]}">${esc(n.e.n)}</span>`; body = `${esc(n.e.s)}<br>${n.e.t1 == null ? `running ${dur(now - n.e.t0)}` : `${dur(n.e.t1 - n.e.t0)}${n.e.err ? ' · failed' : ''}`}`; }
  if (n.kind === 'file') body = `${esc(home(n.path))}<br>${n.touches.length} agent${n.touches.length > 1 ? 's' : ''} · ${n.write ? 'edited' : 'read'}`;
  tip.innerHTML = `<b>${head}</b><div>${body}</div>`;
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x + 14, innerWidth - r.width - 8) + 'px';
  tip.style.top = Math.min(y + 14, innerHeight - r.height - 8) + 'px';
}

/* ---------- inspector ---------- */
function activity(a, now){
  const open = [...a.events].reverse().find(e => e.t1 == null && e.c !== 'prompt');
  if (open) return `${open.n} · ${open.s || ''}`;
  if (a.running) return 'thinking…';
  return a.last ? `idle · ${ago(now - a.last)} ago` : 'idle';
}
function callRows(s, a, now){
  return a.events.filter(e => e.c !== 'prompt').slice(-14).reverse().map(e => `<button class="row" data-sel="${esc(`t:${s.id}:${a.id}:${e.t0}:${e.n}`)}"><i class="${e.t1 == null ? 'live' : ''}" style="background:${e.err ? ERR : COL[e.c]}"></i><span class="t">${esc(e.n)}<small>${esc(e.s)}</small></span><span class="d ${e.err ? 'err' : ''}">${e.t1 == null ? 'running' : dur(e.t1 - e.t0)}</span></button>`).join('') || '<div class="row"><i></i><span class="t" style="color:var(--muted)">No tool calls in this window</span></div>';
}
// A call id ('t:sid:aid:t0:name') resolves even when the call is too old to be drawn as a node.
function find(id){
  if (!id) return null;
  const n = nodes.get(id);
  if (n || !data) return n || null;
  const m = /^t:([^:]+):([^:]+):([^:]+):(.+)$/.exec(id);
  const s = m && data.sessions.find(s => s.id === m[1]), a = s && s.agents.find(a => a.id === m[2]);
  const e = a && a.events.find(e => String(e.t0) === m[3] && e.n === m[4]);
  return e ? {id, kind:'tool', e, s, label:e.n} : null;
}
const ME = 'web-' + Math.random().toString(36).slice(2);
let selV = 0;
async function share(id){
  try {
    const r = await fetch('/api/select', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, by:ME})});
    selV = Math.max(selV, (await r.json()).v || 0);
  } catch {}
}
function select(id, remote){
  selected = id;
  if (id && !remote) share(id);
  const box = $('#inspector');
  box.hidden = !id;
  renderInspector();
}
function renderInspector(){
  const box = $('#inspector'), n = find(selected);
  if (!n){ box.hidden = true; return; }
  const now = nowS();
  let kind = n.kind, title = n.label, body = '';
  if (n.kind === 'session'){
    const s = n.s;
    kind = `session · ${s.status}`;
    body += `<dl class="kv"><dt>Folder</dt><dd>${esc(home(s.cwd))}</dd><dt>Model</dt><dd>${esc(modelName(s.model))}</dd><dt>Context</dt><dd>${s.ctx ? Math.round(s.ctx/1000) + 'k tokens' : '—'}</dd>${s.title ? `<dt>Topic</dt><dd>${esc(s.title)}</dd>` : ''}</dl>`;
    if (s.prompt) body += `<div><div class="sec">Last prompt</div><div class="quote">${esc(s.prompt)}</div></div>`;
    const subs = s.agents.filter(a => a.id !== 'main');
    if (subs.length) body += `<div><div class="sec">Subagents</div><div class="list">${subs.map(a => `<button class="row" data-sel="a:${s.id}:${a.id}"><i class="${a.running ? 'live' : ''}" style="background:${a.running ? COL.agent : FAINT}"></i><span class="t">${esc(a.label)}<small>${esc(a.type)}</small></span><span class="d">${a.running ? 'running' : 'done'}</span></button>`).join('')}</div></div>`;
    body += `<div><div class="sec">Main agent · ${esc(activity(s.agents[0], now))}</div><div class="list">${callRows(s, s.agents[0], now)}</div></div>`;
  } else if (n.kind === 'agent'){
    const a = n.a;
    kind = `${a.type} · ${a.running ? 'running' : 'finished'}`;
    body += `<dl class="kv"><dt>Session</dt><dd><button class="row" style="padding:0" data-sel="s:${n.s.id}"><i style="background:${ACCENT}"></i><span class="t">${esc(n.s.name)}</span><span></span></button></dd><dt>Now</dt><dd>${esc(activity(a, now))}</dd><dt>Model</dt><dd>${esc(modelName(a.model))}</dd><dt>Context</dt><dd>${a.ctx ? Math.round(a.ctx/1000) + 'k tokens' : '—'}</dd></dl>`;
    body += `<div><div class="sec">Recent calls</div><div class="list">${callRows(n.s, a, now)}</div></div>`;
  } else if (n.kind === 'tool'){
    const e = n.e;
    kind = `tool call · ${CATS[e.c]}`;
    title = e.n;
    body += `<dl class="kv"><dt>Status</dt><dd class="${e.err ? 'err' : ''}">${e.t1 == null ? `running ${dur(now - e.t0)}` : e.err ? 'failed' : 'done'}</dd><dt>Took</dt><dd>${e.t1 == null ? '—' : dur(e.t1 - e.t0)}</dd><dt>Started</dt><dd>${ago(now - e.t0)} ago</dd><dt>Session</dt><dd>${esc(n.s.name)}</dd></dl>`;
    const d = calls[n.id];
    body += d ? `<div><div class="sec">Input</div><pre class="io">${esc(d.in) || '(none)'}</pre></div>`
      + `<div><div class="sec">Output</div><pre class="io ${e.err ? 'err' : ''}">${d.done ? esc(d.out) || '(none)' : 'still running…'}</pre></div>`
      : `<div><div class="sec">Detail</div><div class="quote">${esc(e.s)}</div></div>`;
    if (!d || !d.done) loadCall(n.id);
    if (e.f) body += `<button class="row" data-sel="f:${esc(e.f)}"><i style="background:${COL[e.c]}"></i><span class="t">${esc(base(e.f))}<small>open file node</small></span><span></span></button>`;
  } else {
    kind = `file · ${n.write ? 'edited' : 'read only'}`;
    body += `<dl class="kv"><dt>Path</dt><dd>${esc(home(n.path))}</dd></dl>`;
    body += `<div><div class="sec">Touched by</div><div class="list">${n.touches.map(t => `<button class="row" data-sel="${esc(t.agent.id)}"><i style="background:${t.write ? COL.write : COL.read}"></i><span class="t">${esc(t.agent.label)}<small>${esc(t.session.name)}</small></span><span class="d">${t.write ? 'edit' : 'read'} · ${ago(now - t.t)}</span></button>`).join('')}</div></div>`;
  }
  if (data.herdr && n.s && (n.kind === 'session' || n.kind === 'agent'))
    body = `<div class="jump"><button data-jump="${n.s.pid}">Jump to terminal pane</button><span>${esc(jumpMsg[n.s.pid] || '')}</span></div>` + body;
  // re-rendered every poll: keep the reader's scroll position while the same node stays selected
  const keep = box.dataset.id === n.id ? [...box.querySelectorAll('.ins-body, pre.io')].map(x => x.scrollTop) : [];
  box.dataset.id = n.id;
  box.innerHTML = `<div class="ins-head"><div><div class="kind">${esc(kind)}</div><h2>${esc(title)}</h2></div><button class="close" aria-label="Close details">✕</button></div><div class="ins-body">${body}</div>`;
  box.querySelectorAll('.ins-body, pre.io').forEach((x, i) => { x.scrollTop = keep[i] || 0; });
}
const calls = {}, loading = new Set();
async function loadCall(id){
  if (loading.has(id)) return;
  loading.add(id);
  try {
    const r = await fetch('/api/call?id=' + encodeURIComponent(id), {cache:'no-store'});
    if (r.ok){ calls[id] = await r.json(); if (selected === id) renderInspector(); }
  } catch {}
  loading.delete(id);
}
const jumpMsg = {};
async function jump(pid){
  jumpMsg[pid] = 'Switching…'; renderInspector();
  try {
    const r = await fetch('/api/focus', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pid})});
    const j = await r.json().catch(() => ({}));
    jumpMsg[pid] = j.pane ? `Focused herdr pane ${j.pane}` : 'No herdr pane is running this session.';
  } catch { jumpMsg[pid] = 'Map server is not responding.'; }
  renderInspector();
}
$('#inspector').addEventListener('click', e => {
  if (e.target.closest('.close')) return select(null);
  const j = e.target.closest('[data-jump]');
  if (j) return jump(Number(j.dataset.jump));
  const b = e.target.closest('[data-sel]');
  if (b && find(b.dataset.sel)) select(b.dataset.sel);
});

/* ---------- data ---------- */
$('#legend').innerHTML = `<span><i style="background:${ACCENT}"></i>Session</span><span><i style="background:${WAIT}"></i>Waiting on you</span><span><i style="background:${COL.agent}"></i>Subagent</span>`
  + Object.entries(CATS).filter(([k]) => k !== 'agent').map(([k, v]) => `<span><i style="background:${COL[k]}"></i>${v}</span>`).join('')
  + `<span><i class="sq" style="border:1.5px solid ${COL.read}"></i>File</span><span class="hint">Drag to pan · scroll to zoom · click for details · double-click to fit</span>`;

async function poll(){
  try {
    const r = await fetch('/api/state', {cache:'no-store'});
    data = await r.json();
    offset = data.now*1000 - Date.now();
    document.body.classList.remove('offline');
    sync();
    const sel = data.sel;
    if (sel && sel.v > selV){
      selV = sel.v;
      if (sel.by !== ME && sel.id && sel.id !== selected && find(sel.id)) select(sel.id, true);
    }
    const list = data.sessions;
    const busy = list.filter(s => s.status === 'busy').length, waiting = list.filter(s => s.status === 'waiting').length;
    document.title = waiting ? `(${waiting}) waiting · hivemap` : 'hivemap';
    const subs = list.reduce((n, s) => n + s.agents.filter(a => a.id !== 'main' && a.running).length, 0);
    const running = [...nodes.values()].filter(n => n.kind === 'tool' && n.active).length;
    $('#stats').innerHTML = `<b>${list.length}</b> session${list.length === 1 ? '' : 's'} · ${waiting ? `<b style="color:var(--wait)">${waiting}</b> waiting on you · ` : ''}<b>${busy}</b> working · <b>${subs}</b> subagent${subs === 1 ? '' : 's'} · <b>${running}</b> call${running === 1 ? '' : 's'} running`;
    $('#empty').hidden = list.length > 0;
    if (selected) renderInspector();
  } catch {
    document.body.classList.add('offline');
    $('#stats').textContent = 'Map server stopped. Run hivemap to start it.';
  }
  setTimeout(poll, 1000);
}
poll();
requestAnimationFrame(frame);
</script>
</body>
</html>
