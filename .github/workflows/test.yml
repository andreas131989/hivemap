name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3   # hard cap: a whole job over 3 minutes is a failure, never a wait
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install tmux (for the pane-jump tests)
        run: if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else command -v tmux || sudo apt-get install -y tmux; fi
      - name: Unit tests
        run: python -m unittest -v
      - name: Shell lint
        if: runner.os == 'Linux'
        run: shellcheck bin/hivemap
      - name: Open the map for real (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 1
        env:
          HIVEMAP_PORT: '7801'
          HIVEMAP_NOTIFY: '0'
        run: |
          bin/hivemap   # exactly what /hivemap:map runs: start the server, open the window, return
          # Chrome must be started as an app window on the map's address. (CI Macs have no desktop login,
          # so Chrome can start but never draws the page; that last step needs a real Mac.)
          for _ in $(seq 30); do pgrep -fl -- "--app=http://127.0.0.1:7801" | grep -q "Google Chrome.app/Contents/MacOS" && break; sleep 0.5; done
          pgrep -fl -- "--app=http://127.0.0.1:7801" | grep "Google Chrome.app/Contents/MacOS" | cut -c1-160
          bin/hivemap stop
          pkill -f -- "--app=http://127.0.0.1:7801" || true
      - name: Desktop notification command (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'server')
          import overlay
          real = subprocess.run
          def run(cmd, **kw):   # the exact command hivemap builds, run for real, must succeed
              r = real(cmd, **kw)
              print(cmd[:2], '->', r.returncode, r.stderr)
              assert r.returncode == 0, r.stderr
              return r
          overlay.subprocess.run = run
          overlay.notify('CI check: café 中文 -dash "quotes"')
          PY

  # One stable name for branch protection to require, whatever the matrix becomes.
  ok:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.test.result }}" = success
