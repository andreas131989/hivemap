name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3   # hard cap: a whole job over 3 minutes is a failure, never a wait
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install tmux (for the pane-jump tests)
        run: if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else command -v tmux || sudo apt-get install -y tmux; fi
      - name: Unit tests
        run: python -m unittest -v
      - name: Shell lint
        if: runner.os == 'Linux'
        run: shellcheck bin/hivemap
      - name: Open the map for real (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 1
        env:
          HIVEMAP_PORT: '7801'
        run: |
          ls -d "/Applications/Google Chrome.app"
          # the server, with request logging on, so we can see the browser load the map
          python - > requests.log 2>&1 <<'PY' &
          import sys
          sys.path.insert(0, 'server')
          import overlay
          overlay.PORT = 7801
          class Logged(overlay.Handler):
              def log_message(self, fmt, *args):
                  print(self.command, self.path, self.headers.get('User-Agent', ''), flush=True)
          overlay.Server(('127.0.0.1', 7801), Logged).serve_forever()
          PY
          sleep 2
          bin/hivemap   # the server is up, so this only opens the window, exactly as for a user
          # Chrome starts in the background: give it up to 15s to appear as an app window (not a tab), then
          # up to 15s more to load the map and start polling the server
          for _ in $(seq 30); do pgrep -f -- "--app=http://127.0.0.1:7801" >/dev/null && break; sleep 0.5; done
          for _ in $(seq 30); do grep -q "GET /api/state .*Chrome" requests.log && break; sleep 0.5; done
          if ! grep -q "GET /api/state .*Chrome" requests.log; then
            echo "Chrome processes:"; pgrep -fl -i chrome | cut -c1-200 || echo "(none)"
            echo "server saw:"; cat requests.log
            exit 1
          fi
          pgrep -fl -- "--app=http://127.0.0.1:7801" | cut -c1-160
          grep -m3 "Chrome" requests.log
          pkill -f -- "--app=http://127.0.0.1:7801" || true
          kill %1 || true
      - name: Desktop notification command (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'server')
          import overlay
          real = subprocess.run
          def run(cmd, **kw):   # the exact command hivemap builds, run for real, must succeed
              r = real(cmd, **kw)
              print(cmd[:2], '->', r.returncode, r.stderr)
              assert r.returncode == 0, r.stderr
              return r
          overlay.subprocess.run = run
          overlay.notify('CI check: café 中文 -dash "quotes"')
          PY

  # One stable name for branch protection to require, whatever the matrix becomes.
  ok:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.test.result }}" = success
