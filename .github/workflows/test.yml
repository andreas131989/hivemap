name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest -v
        continue-on-error: ${{ runner.os == 'macOS' }}   # temporary, while debugging the macOS launcher
      - name: Shell lint
        if: runner.os == 'Linux'
        run: shellcheck bin/hivemap
      - name: Debug launcher start (temporary)
        if: runner.os == 'macOS'
        run: |
          export HIVEMAP_PORT=7801 HIVEMAP_NOTIFY=0
          (bash -x bin/hivemap start > trace.txt 2>&1; echo "exit=$?" >> trace.txt) &
          sleep 15
          echo "--- trace"; cat trace.txt
          echo "--- log"; cat ~/.local/state/hivemap.log || true
          echo "--- procs"; ps -axo pid,ppid,command | grep -i "hivemap\|overlay\|curl" | grep -v grep || true
          echo "--- curl"; curl -sv --max-time 3 http://127.0.0.1:7801/api/select 2>&1 | tail -15 || true

  # One stable name for branch protection to require, whatever the matrix becomes.
  ok:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.test.result }}" = success
